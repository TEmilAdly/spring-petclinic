name: Deploy and Test Cluster

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-and-test-cluster.yml'
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-and-test-cluster.yml'

jobs:
  deploy-and-test-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - name: Create demo database Secret
        run: bash k8s/create-db-secret.sh default

      - name: Deploy application
        run: |
          kubectl --namespace default apply -f k8s/

      - name: Wait for Pods to be ready
        run: |
          kubectl --namespace default rollout status deployment/demo-db --timeout=180s
          kubectl --namespace default rollout status deployment/petclinic --timeout=180s

